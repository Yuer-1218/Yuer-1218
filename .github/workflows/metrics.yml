name: Metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: yuer-1218
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Riyadh
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # achievements disabled: plugin broken upstream (Projects classic sunset)
          # re-enable when fixed: https://github.com/lowlighter/metrics/issues/1706

          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
